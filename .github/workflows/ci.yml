name: Tests and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: app
      DB_PASSWORD: ci_test_password
      DB_DATABASE: app_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npx typeorm-ts-node-commonjs migration:run -d src/data-source.ts

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run HTTP and database tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build